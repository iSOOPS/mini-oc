name: Build and Push to Harbor

on:
  push:
    branches:
      # 打包源分支：mini-oc-web 的实际开发分支（main 目前仅有 LICENSE/README）
      - feature/v2
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: harbor.gxrs.net
  # Harbor 项目 / 镜像名。
  # library 为私有项目，需用在该项目内有角色的账号（机器人账号 robot$xxx）。
  IMAGE_NAME: library/mini-oc-web
  # 基础镜像来源，对应 Dockerfile 的 ARG REGISTRY。
  # 国内网络可改为镜像加速域名（如 docker.m.daocloud.io）。
  BASE_REGISTRY: docker.io

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v6

      # 2. 前置检查：Dockerfile 用 npm ci，缺少 lock 文件必然构建失败
      - name: Check build prerequisites
        run: |
          set -euo pipefail
          missing=0
          for f in apps/mini-oc-web/Dockerfile apps/mini-oc-web/web/package-lock.json Cargo.toml Cargo.lock; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少必需文件 ${f}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::构建前置条件不满足。请确认 apps/mini-oc-web/web/package-lock.json 已提交入库（npm ci 依赖它）。"
            exit 1
          fi
          echo "前置检查通过。"

      # 3. 登录 Harbor
      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # 4. 校验 Harbor 目标仓库是否可推送（四层检查，任一失败立即终止）
      #    1) 项目存在且不是代理缓存项目（registry_id=0）
      #    2) token 服务确实授予 push（机器人账号权限）
      #    3) registry 端接受写入探测（HEAD manifest 返回 404 而非 401）
      #    4) blob 上传 Location 必须是 https —— Harbor external_url 配置错误时
      #       会返回 http://，buildx push 将报
      #       "unauthorized: authorize header needed to send HEAD to repository"
      - name: Verify Harbor repository is pushable
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          project="${IMAGE_NAME%%/*}"

          # (1) 项目存在且是普通项目
          proj_json=$(curl -sS --fail-with-body \
            -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
            "https://${REGISTRY}/api/v2.0/projects/${project}" || true)
          if [ -z "${proj_json}" ]; then
            echo "::error::无法读取 Harbor 项目 ${project}，请检查 HARBOR_USERNAME / HARBOR_PASSWORD 与项目名称。"
            exit 1
          fi
          registry_id=$(printf '%s' "${proj_json}" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin).get("registry_id") or 0)' 2>/dev/null || echo 0)
          if [ "${registry_id}" != "0" ]; then
            echo "::error::Harbor 项目 ${project} 是代理缓存项目（registry_id=${registry_id}），Harbor 禁止向其推送镜像。"
            exit 1
          fi

          # (2) token 服务必须真的授予 push
          token_json=$(curl -sS --fail-with-body \
            -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
            "https://${REGISTRY}/service/token?service=harbor-registry&scope=repository:${IMAGE_NAME}:pull,push" \
            || true)
          granted=$(printf '%s' "${token_json}" \
            | python3 -c '
          import base64, json, sys
          data = json.load(sys.stdin) or {}
          token = data.get("token") or data.get("access_token") or ""
          parts = token.split(".")
          if len(parts) != 3:
              raise SystemExit(0)
          payload = parts[1] + "=" * (-len(parts[1]) % 4)
          actions = set()
          for entry in json.loads(base64.urlsafe_b64decode(payload)).get("access", []):
              actions.update(entry.get("actions", []))
          print(" ".join(sorted(actions)))
          ' 2>/dev/null || true)
          echo "  目标仓库：${REGISTRY}/${IMAGE_NAME}"
          echo "  授予的权限：${granted:-<无>}"
          if ! printf '%s' "${granted}" | grep -qw push; then
            echo "::error::当前账号对 ${REGISTRY}/${IMAGE_NAME} 没有 push 权限。"
            echo "::error::请在 Harbor 确认机器人账号已创建、未停用，且对项目 ${project} 具有 Maintainer/Developer 角色或项目级 push 权限。"
            exit 1
          fi

          # (3) registry 端写入探测：带 token HEAD manifest，404=鉴权通过，401/403=被拒
          probe_token=$(printf '%s' "${token_json}" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          probe_code=$(curl -sS -o /dev/null -w '%{http_code}' -I \
            -H "Authorization: Bearer ${probe_token}" \
            "https://${REGISTRY}/v2/${IMAGE_NAME}/manifests/__push_probe__" || echo 000)
          echo "  registry 写入探测：HTTP ${probe_code}（期望 404）"
          if [ "${probe_code}" != "404" ]; then
            echo "::error::registry 端拒绝了对 ${REGISTRY}/${IMAGE_NAME} 的写入（HTTP ${probe_code}）。"
            exit 1
          fi

          # (4) blob 上传 Location 必须是 https 或相对路径（external_url 配置错误时为 http://）
          location=$(curl -sS -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
            -X POST "https://${REGISTRY}/v2/${IMAGE_NAME}/blobs/uploads/" \
            -D - -o /dev/null \
            | grep -i '^location:' | cut -d' ' -f2- | tr -d '\r' || true)
          echo "  blob 上传 Location：${location:-<未返回>}"
          case "${location}" in
            https://*|/*) : ;;
            http://*)
              echo "::error::Harbor 返回了明文 http:// 上传地址，buildx push 必然失败（本次 CI 报错即此因）。"
              echo "::error::请在 Harbor 的 harbor.yml 中将 external_url 配置为 https://${REGISTRY}，"
              echo "::error::并确认前置 nginx 透传 X-Forwarded-Proto，然后重启 Harbor 后重试。"
              exit 1
              ;;
            *)
              echo "::warning::未获取到 blob 上传 Location，跳过该检查。"
              ;;
          esac
          echo "  校验通过，具备推送条件。"

      # 5. 配置 Buildx（gha 缓存后端依赖 docker-container 驱动）
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 6. 计算镜像标签
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 打 v* 标签时：v2.0.0 / 2.0.0 / 2.0，并附带 latest
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 推送分支时：feature-v2
            type=ref,event=branch
            # 打包源分支 feature/v2 的构建附带 latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/feature/v2' }}
            # 任意提交：完整 commit sha，便于按提交定位镜像
            type=sha,format=long

      # 7. 构建并推送
      - name: Build and Push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/mini-oc-web/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            REGISTRY=${{ env.BASE_REGISTRY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mini-oc-web
          cache-to: type=gha,mode=max,scope=mini-oc-web,ignore-error=true

      # 8. 汇报结果
      - name: Summary
        run: |
          {
            echo "### 镜像推送完成"
            echo ""
            echo "- 镜像：\`${REGISTRY}/${IMAGE_NAME}\`"
            echo "- 标签：\`${{ steps.meta.outputs.tag-names }}\`"
            echo "- Digest：\`${{ steps.build.outputs.digest }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
