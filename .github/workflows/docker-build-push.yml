name: Build and Push to Harbor

on:
  push:
    branches:
      # 打包源分支：mini-oc-web 的实际开发分支（main 目前仅有 LICENSE/README）
      - feature/v2
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: harbor.gxrs.net
  # Harbor 项目 / 镜像名。
  # library 为私有项目，需用在该项目内有角色的账号（机器人账号 robot$xxx）。
  IMAGE_NAME: library/mini-oc-web
  # 基础镜像来源，对应 Dockerfile 的 ARG REGISTRY。
  # 国内网络可改为镜像加速域名（如 docker.m.daocloud.io）。
  BASE_REGISTRY: docker.io

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v6

      # 2. 前置检查：Dockerfile 用 npm ci，缺少 lock 文件必然构建失败
      - name: Check build prerequisites
        run: |
          set -euo pipefail
          missing=0
          for f in apps/mini-oc-web/Dockerfile apps/mini-oc-web/web/package-lock.json Cargo.toml Cargo.lock; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少必需文件 ${f}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::构建前置条件不满足。请确认 apps/mini-oc-web/web/package-lock.json 已提交入库（npm ci 依赖它）。"
            exit 1
          fi
          echo "前置检查通过。"

      # 3. 登录 Harbor
      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # 4. 校验 Harbor 目标仓库是否可推送
      #    直接向 Harbor 的 token 服务申请 push 授权：能拿到 push 即表示项目可推送。
      #    Harbor 内置的 library 项目是 Docker Hub 代理缓存项目，对它不授予 pull/push。
      - name: Verify Harbor repository is pushable
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          scope="repository:${IMAGE_NAME}:pull,push"
          token_json=$(curl -sS --fail-with-body \
            -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
            "https://${REGISTRY}/service/token?service=harbor-registry&scope=${scope}" \
            || true)
          if [ -z "${token_json}" ]; then
            echo "::error::无法从 ${REGISTRY} 获取仓库令牌，请检查 HARBOR_USERNAME / HARBOR_PASSWORD 是否正确。"
            exit 1
          fi
          # 令牌是 JWT，第二段为 base64url 编码的 payload，其中 access[].actions 列出实际授予的动作
          granted=$(printf '%s' "${token_json}" \
            | python3 -c '
          import base64, json, sys
          data = json.load(sys.stdin) or {}
          token = data.get("token") or data.get("access_token") or ""
          parts = token.split(".")
          if len(parts) != 3:
              raise SystemExit(0)
          payload = parts[1] + "=" * (-len(parts[1]) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          actions = set()
          for entry in claims.get("access", []):
              actions.update(entry.get("actions", []))
          print(" ".join(sorted(actions)))
          ' 2>/dev/null || true)
          echo "  目标仓库：${REGISTRY}/${IMAGE_NAME}"
          echo "  授予的权限：${granted:-<无>}"
          if ! printf '%s' "${granted}" | grep -qw push; then
            echo "::error::当前账号对 ${REGISTRY}/${IMAGE_NAME} 没有 push 权限，无法推送镜像。"
            echo "::error::请在 Harbor 中确认：1) 该项目存在且不是 Docker Hub 代理缓存项目；2) 已把当前账号（或对应机器人账号）加入该项目并授予 Maintainer/Developer 角色。"
            exit 1
          fi
          echo "  校验通过，具备推送权限。"

      # 5. 配置 Buildx（gha 缓存后端依赖 docker-container 驱动）
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 6. 计算镜像标签
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 打 v* 标签时：v2.0.0 / 2.0.0 / 2.0，并附带 latest
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 推送分支时：feature-v2
            type=ref,event=branch
            # 打包源分支 feature/v2 的构建附带 latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/feature/v2' }}
            # 任意提交：完整 commit sha，便于按提交定位镜像
            type=sha,format=long

      # 7. 构建并推送
      - name: Build and Push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/mini-oc-web/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            REGISTRY=${{ env.BASE_REGISTRY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mini-oc-web
          cache-to: type=gha,mode=max,scope=mini-oc-web,ignore-error=true

      # 8. 汇报结果
      - name: Summary
        run: |
          {
            echo "### 镜像推送完成"
            echo ""
            echo "- 镜像：\`${REGISTRY}/${IMAGE_NAME}\`"
            echo "- 标签：\`${{ steps.meta.outputs.tag-names }}\`"
            echo "- Digest：\`${{ steps.build.outputs.digest }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
